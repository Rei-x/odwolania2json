<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>odwołania → json</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --ink:#0b1a20; --ink2:#41525a; --mute:#8a979d; --line:#e6e9e7; --card:#fff;
  --bg:#f3f4f1; --accent:#e8004f; --teal:#0f7f86; --amber:#c27803; --ok:#16a34a; --warn:#d97706; --info:#2563eb;
  --r:18px; --sh:0 1px 2px rgba(11,26,32,.04),0 8px 28px rgba(11,26,32,.07);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 10% -10%,#fde7ef 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#dff3f3 0,transparent 55%),var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.mark{font-weight:800;letter-spacing:-.03em}
.mark i{font-style:normal;color:var(--accent)}
a.mark{color:inherit;text-decoration:none}
#expop{position:fixed;top:62px;right:20px;width:360px;max-height:70vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:8px;display:none;z-index:21;font-size:13px}
#expop.on{display:block}
#expop button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:10px}
#expop button:hover{background:#f6f7f6}
#expop b{display:block;font-size:13.5px}#expop small{display:block;color:var(--mute);margin-top:2px;line-height:1.35}
#expop .h{padding:8px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}

/* ---------- empty state ---------- */
#empty{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .35s,transform .35s}
#empty.gone{opacity:0;transform:scale(.98);pointer-events:none}
.hero{display:flex;flex-direction:column;align-items:center;gap:28px}
.hero .mark{font-size:44px}
.drop{width:min(560px,86vw);aspect-ratio:16/10;border-radius:28px;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);
  border:1.5px dashed #cfd6d3;display:grid;place-items:center;box-shadow:var(--sh);transition:.2s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 18px 50px rgba(232,0,79,.12)}
.drop .ic{width:76px;height:76px;margin:0 auto 14px;display:block}
.drop b{display:block;font-size:18px;text-align:center}
.drop small{display:block;color:var(--mute);text-align:center;margin-top:4px}
.types{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:#fff;box-shadow:var(--sh);font-size:12.5px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mute)}
.t-odwolanie{--c:var(--accent)} .t-pelnomocnictwo{--c:var(--teal)} .t-przelew{--c:var(--amber)} .t-error{--c:#b91c1c} .t-inny{--c:var(--mute)}
[class*="t-"] .dot{background:var(--c)}

/* ---------- workspace ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-rows:60px 1fr;opacity:0;transition:opacity .35s}
#app.on{opacity:1}
#app:not(.on){pointer-events:none}
header{display:flex;align-items:center;gap:14px;padding:0 20px;min-width:0}
header > *{flex:none}
header .mark{font-size:19px;white-space:nowrap}
#tabs{display:flex;gap:6px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none;padding:4px 2px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;max-width:210px}
.tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ndocs{font-size:12px;color:var(--mute);white-space:nowrap}
@media (max-width:1150px){header .mark{display:none}}
.tab{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.6);color:var(--ink2);
  white-space:nowrap;transition:.15s;font-size:13px}
.tab:hover{background:#fff}
.tab.on{background:var(--ink);color:#fff}
.tab.on .dot{box-shadow:0 0 0 2px var(--ink),0 0 0 3.5px var(--c)}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--sh);transition:.15s}
.iconbtn:hover{transform:translateY(-1px)}
.iconbtn svg{width:18px;height:18px}
main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 20px 20px;min-height:0}

/* document */
#doc{overflow:auto;border-radius:var(--r);padding:18px;scroll-behavior:smooth}
.page{position:relative;margin:0 auto 18px;max-width:760px;background:#fff;border-radius:10px;box-shadow:var(--sh);overflow:hidden}
.page img{display:block;width:100%;height:auto}
.page .pn{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--mute)}
.hl{position:absolute;border-radius:3px;background:rgba(232,0,79,.16);outline:2px solid rgba(232,0,79,.85);outline-offset:1px;
  animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(1.25);opacity:0}to{transform:none;opacity:1}}

/* result */
#res{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.rhead{padding:18px 20px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.rtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:8px}
.rtitle h2{margin:0;font-size:22px;letter-spacing:-.02em}
.rtitle .sw{margin-left:auto;display:flex;background:#f1f3f2;border-radius:99px;padding:3px}
.sw button{padding:5px 12px;border-radius:99px;font-size:12.5px;color:var(--ink2)}
.sw button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:#f1f3f2;color:var(--ink2);display:inline-flex;gap:5px;align-items:center}
.chip svg{width:13px;height:13px}
.rbody{overflow:auto;flex:1;padding:6px 8px 14px}
.sec{margin:14px 12px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.row{display:grid;grid-template-columns:minmax(120px,38%) 1fr 14px;gap:12px;align-items:baseline;padding:8px 12px;border-radius:10px;cursor:pointer;transition:background .12s}
.row:hover{background:#f6f7f6}
.row.on{background:#fff0f5}
.row .k{color:var(--ink2);font-size:13px}
.row .v{font-weight:600;word-break:break-word}
.row .v.null{color:#c4cbc8;font-weight:400}
.row .dot{align-self:center;width:7px;height:7px}
.m-located{background:var(--ok)!important} .m-inferred{background:var(--warn)!important} .m-derived{background:var(--info)!important}
.ev{grid-column:1/-1;font-size:12.5px;color:var(--ink2);background:#fafafa;border-radius:8px;padding:8px 10px;margin-top:6px;display:none}
.row.on .ev{display:block}
.ev mark{background:#ffe1ea;color:var(--ink);border-radius:3px;padding:0 2px}
.sub{margin:6px 12px 0;font-size:12px;color:var(--mute)}
pre.json{margin:0;padding:14px 16px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
.jk{color:#7c3aed}.js{color:#0f766e}.jn{color:#c2410c}.jz{color:#a3aeab}
.fixes{margin:4px 12px 10px;padding:10px 12px;border-radius:10px;background:#eff6ff;font-size:12.5px;color:#1e3a8a}
.fixes div{margin-top:3px}

/* skeleton */
.sk{background:linear-gradient(90deg,#eef0ef 25%,#f7f8f7 50%,#eef0ef 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(0,0,0,.15);border-top-color:var(--c,var(--accent));animation:rot .8s linear infinite;flex:none}
.tab.on .spin{border-color:rgba(255,255,255,.25);border-top-color:#fff}
@keyframes rot{to{transform:rotate(360deg)}}

#qual{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);padding:6px 12px;border-radius:99px;font-size:12px;color:var(--ink2);white-space:nowrap;width:268px;box-sizing:border-box}
#qual input{width:92px;flex:none;accent-color:var(--accent);margin:0}
#qual b{color:var(--ink);width:78px;flex:none;display:inline-block;text-align:left;overflow:hidden;text-overflow:ellipsis}
#mdl{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.7);padding:6px 10px 6px 12px;border-radius:99px;font-size:12px;color:var(--ink2);white-space:nowrap;max-width:180px;min-width:0}
#mdl:hover{background:#fff}
#mdl b{color:var(--ink);overflow:hidden;text-overflow:ellipsis;min-width:0}
#mdl .car{width:10px;height:10px;flex:none;opacity:.6}
#mdl.ov{box-shadow:inset 0 0 0 1.5px var(--ink)}
#mdl.noeu{box-shadow:inset 0 0 0 1.5px var(--amber)}
#mdl:disabled{opacity:.55;cursor:default}
.bdg{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;background:#eef0ef;color:var(--ink2);flex:none;line-height:1.5}
.bdg.p20{background:#d5efe9;color:#0b4d52}.bdg.p18{background:#ddf0ec;color:#0b4d52}.bdg.p12{background:#e7f3f1;color:#245a5e}.bdg.p8,.bdg.p4{background:#f0f3f2;color:var(--ink2)}.bdg.p0{background:#f6eeee;color:#8a3b3b}
.bdg.eu{background:#e6edfb;color:#1e40af}.bdg.noeu{background:#fdf1dc;color:#92400e}
#mpop{position:fixed;top:62px;width:470px;max-height:min(70vh,560px);overflow:auto;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:6px;display:none;z-index:22;font-size:13px}
#mpop.on{display:block}
#mpop .h{padding:10px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
#mpop .h span{text-transform:none;letter-spacing:0;font-weight:500;white-space:nowrap}
#mpop button{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;align-items:center}
#mpop button:hover{background:#f6f7f6}
#mpop button.on{background:#fff0f5}
#mpop .ck{color:var(--accent);font-weight:700;font-size:12px}
#mpop .nm b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mpop .nm small{display:block;color:var(--mute);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mpop .bd{display:flex;gap:4px;justify-content:flex-end;flex-wrap:nowrap}
#mpop .warn{margin:2px 10px 8px;font-size:11.5px;color:#92400e;background:#fdf6e9;border-radius:8px;padding:6px 9px}
.chip.ov{background:var(--ink);color:#fff}
.chip.noeu{background:#fdf1dc;color:#92400e}
#mdl .ic{width:14px;height:14px;flex:none;opacity:.7}
@media (max-width:1600px){#mdl .lb{display:none}}
@media (max-width:1500px){#mdl{max-width:150px}}
@media (max-width:1400px){#mdl{max-width:120px}#mdl #mbdg{display:none}#qual{width:206px}#qual>span{display:none}}
@media (max-width:1100px){header a.hbtn[href="/benchmarks"]{display:none}#mdl{max-width:96px}}
#mem{font-size:12px;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.7);color:var(--ink2);white-space:nowrap}
#mem:hover{background:#fff}
#mempop{position:fixed;top:62px;right:20px;width:320px;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:14px 16px;display:none;z-index:20;font-size:13px}
#mempop.on{display:block}
#mempop svg{width:100%;height:70px}
.approve{margin-left:8px;padding:6px 14px;border-radius:99px;background:var(--ink);color:#fff;font-size:12.5px}
.approve.edited{background:var(--accent)}
.row .v input{width:100%;font:inherit;font-weight:600;border:1px solid var(--accent);border-radius:6px;padding:2px 6px}
.row.edited .v{color:var(--accent)}
.chk{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:9px 12px;border-radius:10px;align-items:start}
.chk:nth-child(odd){background:#f8f9f8}
.chk .ic{font-weight:700}
.chk.ok .ic{color:var(--ok)} .chk.uwaga .ic{color:var(--warn)} .chk.nd .ic{color:#b6bfbb}
.chk small{display:block;color:var(--mute);word-break:break-all}
#toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--sh);
  display:flex;gap:9px;align-items:center;transform:translateY(20px);opacity:0;transition:.3s;font-size:13px}
#toast.on{transform:none;opacity:1}
#toast svg{width:16px;height:16px;color:#4ade80}
#dragcover{position:fixed;inset:0;background:rgba(232,0,79,.06);border:3px dashed var(--accent);border-radius:20px;margin:10px;display:none;place-items:center;font-weight:700;font-size:20px;color:var(--accent);z-index:9}
#dragcover.on{display:grid}
@media (max-width:900px){main{grid-template-columns:1fr}#doc{max-height:45vh}}
</style>
<link rel="stylesheet" href="/static/wizard.css">
</head>
<body>
<input id="file" type="file" accept=".pdf" multiple hidden>

<section id="empty">
  <div class="hero">
    <a class="mark" href="/">odwołania <i>→</i> json</a>
    <div class="drop" id="drop">
      <div>
        <svg class="ic" viewBox="0 0 76 76" fill="none">
          <rect x="12" y="6" width="38" height="50" rx="7" fill="#fff" stroke="#0b1a20" stroke-width="2.2"/>
          <path d="M20 20h22M20 28h22M20 36h14" stroke="#c9d1ce" stroke-width="2.2" stroke-linecap="round"/>
          <rect x="34" y="40" width="34" height="26" rx="8" fill="#e8004f"/>
          <path d="M45 47c-2 0-3 1-3 3v1.5c0 1-1 1.5-2 1.5 1 0 2 .5 2 1.5V56c0 2 1 3 3 3M57 47c2 0 3 1 3 3v1.5c0 1 1 1.5 2 1.5-1 0-2 .5-2 1.5V56c0 2-1 3-3 3" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <b>Upuść PDF-y sprawy</b>
        <small>lub kliknij</small>
      </div>
    </div>
    <div class="types">
      <span class="pill t-odwolanie"><span class="dot"></span>odwołanie</span>
      <span class="pill t-pelnomocnictwo"><span class="dot"></span>pełnomocnictwo</span>
      <span class="pill t-przelew"><span class="dot"></span>przelew</span>
      <button class="pill" data-ex title="Wczytaj przykładowy trudny dokument">Przykłady</button>
    </div>
    <div class="links2">
      <a class="hbtn new" href="#nowy-typ" data-wizard title="Dodaj klasę dokumentu bez zmian w kodzie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nowy typ dokumentu</a>
      <a class="hbtn" href="/benchmarks" title="Jakie modele, jakie wyniki i dlaczego"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Benchmarki</a>
    </div>
  </div>
</section>

<section id="app">
  <header>
    <a class="mark" href="/">odwołania <i>→</i> json</a>
    <nav id="tabs"></nav>
    <span id="ndocs"></span>
    <div id="qual" title="Dokładność / koszt"><span>koszt</span><input id="qslider" type="range" min="0" max="3" step="1" value="2"><span>jakość</span><b id="qlabel">standard</b></div>
    <button id="mdl" title="Model LLM dla nowych dokumentów"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg><span class="lb">Model</span><b id="mlabel">Auto</b><span id="mbdg"></span><svg class="car" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m2 3.5 3 3 3-3"/></svg></button>
    <button id="mem" title="Pamięć systemu — uczenie w czasie">Pamięć: —</button>
    <a class="hbtn new" href="#nowy-typ" data-wizard title="Nowy typ dokumentu — bez zmian w kodzie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nowy typ</a>
    <a class="hbtn" href="/benchmarks" title="Benchmarki modeli">Benchmarki</a>
    <button id="ex" data-ex title="Przykładowe trudne dokumenty" style="font-size:12px;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.7);color:var(--ink2)">Przykłady</button>
    <button class="iconbtn" id="add" title="Dodaj PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="iconbtn" id="dl" title="Pobierz JSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg></button>
  </header>
  <main>
    <div id="doc"></div>
    <div id="res"></div>
  </main>
</section>

<div id="dragcover">Upuść, aby dodać</div>
<div id="mempop"></div>
<div id="expop"></div>
<div id="mpop"></div>
<div id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4.5 4.5L19 7"/></svg><span></span></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LABEL = {odwolanie:'Odwołanie', pelnomocnictwo:'Pełnomocnictwo', przelew:'Przelew', inny:'Nie rozpoznano typu', error:'Błąd'};
const NICE = {OdwolanieKIO:'Odwołanie', Odwolujacy:'Odwołujący', Zamawiajacy:'Zamawiający', ZamowieniePubliczne:'Zamówienie',
  przelew_bankowy:'Przelew', mocodawca:'Mocodawca', pelnomocnicy:'Pełnomocnik', podpisujacy:'Podpisujący', pelnomocnik:'Pełnomocnik', data:'Dane'};
const KEY = {czynnosc_dzien:'data czynności', czynnosc_powod_id:'powód (id)', czynnosc_opis:'czynność', miejscowosc:'miejscowość',
  'przez-pelnomocnika':'przez pełnomocnika', imie_nazwisko:'imię i nazwisko', numer_bzp:'nr BZP', numer_ted:'nr TED',
  numer_postepowania:'nr postępowania', tytul:'tytuł', prowadzacy_postepowanie:'prowadzący', data_operacji:'data operacji',
  na_rachunek:'na rachunek', z_rachunku:'z rachunku', numer_transakcji:'nr transakcji', nazwa:'nazwa', mail:'e-mail', typ:'typ',
  krs:'KRS', nip:'NIP', regon:'REGON', pesel:'PESEL', kwota:'kwota', data:'data'};

let docs = [], cur = -1, view = 'dane', selected = null;
let caseId = null, PROFILES = ['deterministyczny', 'ekonomiczny', 'standard', 'maksymalny'];
fetch('/api/profiles').then(r => r.json()).then(p => { PROFILES = p.profiles.map(x => x.name); const i = Math.max(0, PROFILES.indexOf(p.default));
  $('#qslider').max = PROFILES.length - 1; $('#qslider').value = i; $('#qlabel').textContent = pname(PROFILES[i]);
  $('#qual').title = p.profiles.map(x => `${x.name}: ${x.opis}`).join('\n'); renderModelBtn(); }).catch(() => {});
const PNAME = { deterministyczny: 'Reguły', ekonomiczny: 'Ekonomiczny', standard: 'Standard', auto: 'Auto', maksymalny: 'Maksymalny' };
const profile = () => PROFILES[+$('#qslider').value];
const pname = n => PNAME[n] || n;
document.addEventListener('input', e => { if (e.target.id === 'qslider') { $('#qlabel').textContent = pname(profile()); $('#qual').title = ''; renderModelBtn(); } });
document.addEventListener('wheel', e => { const t = e.target.closest('#tabs'); if (t && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { t.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
// ---------- model selector (GET /api/models): null = automatic (models defined by the profile) ----------
let MODELS = [], chosen = null;
try { chosen = localStorage.getItem('o2j.model') || null; } catch {}
const model = () => chosen;
const pb = v => v == null ? '?' : v >= 1000 ? (v / 1000).toFixed(1).replace('.', ',') + 'T' : String(v).replace('.', ',') + 'B';
const f3 = v => v == null ? null : v.toFixed(v === 1 ? 3 : 4).replace('.', ',');

    pop.classList.toggle('on'); }); return; }
  const it = e.target.closest('#expop button');
  if (it) loadSample(SAMPLES[+it.dataset.i]); else if (!e.target.closest('#expop')) pop.classList.remove('on');
});
const qs = new URLSearchParams(location.search).get('sample');
if (qs) { history.replaceState(null, '', location.pathname); getSamples().then(l => { const s = l.find(x => x.name === qs); if (s) loadSample(s); }); }
addEventListener('keydown', e => { if (!docs.length) return; if (e.key === 'ArrowRight') select(Math.min(docs.length - 1, cur + 1)); if (e.key === 'ArrowLeft') select(Math.max(0, cur - 1)); });
</script>
