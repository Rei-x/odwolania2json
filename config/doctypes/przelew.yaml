name: przelew
description: Potwierdzenie wykonania pojedynczego przelewu bankowego wygenerowane przez bank (rachunek nadawcy i odbiorcy, kwota, data operacji, tytuł). Nie jest nim faktura, rachunek do zapłaty, wezwanie do zapłaty, wyciąg z wielu operacji ani prezentacja.
classify:
  keywords:
    'POTWIERDZENIE (WYKONANIA |REALIZACJI )?(POLECENIA )?(PRZELEWU|TRANSAKCJI|OPERACJI)': 6
    'Rachunek (zleceniodawcy|odbiorcy|nadawcy|obciążany|uznawany)': 3
    '\bZ RACHUNKU\b|\bNA RACHUNEK\b': 2
    'Tytuł (przelewu|operacji)|\bOPIS:': 2
    'Kwota|WARTOŚĆ': 1
    'Data (operacji|realizacji|transakcji|księgowania)': 2
    'Numer referencyjny|ID transakcji|Numer transakcji': 1
    '(dowód|potwierdzenie) (wykonania )?przelewu|\bprzelew\w*\b': 2
    'Data wykonania|Nadawca|Adresat przelewu|Odbiorca': 1
    '\bPL ?\d{2}(?: ?\d{4}){6}\b': 2
  filename: ['przelew', 'potwierdzenie']
pages: 2
few_shot: 2
examples: {pdf: potwierdzenie_przelewu.pdf, json: przelew.json}   # pliki w każdym folderze data/train/<sprawa>/
instructions: |
  - Numery rachunków: 26 cyfr, bez prefiksu PL i bez spacji.
  - kwota jako liczba dodatnia (np. 15000.00), także gdy bank pokazuje ją ze znakiem minus (obciążenie).
  - tytul przepisz dokładnie, w całości, z zachowaniem wielkości liter.
  - numer_transakcji: numer referencyjny / identyfikator transakcji, jeśli występuje.
fields:
  przelew_bankowy:
    type: object
    properties:
      data_operacji: {type: date, description: Data operacji / wykonania przelewu.}
      kwota: {type: number, normalize: [amount], description: Kwota przelewu.}
      na_rachunek: {type: string, normalize: [iban], pattern: '\d{26}', description: Rachunek odbiorcy (26 cyfr).}
      numer_transakcji: {type: string, description: Numer referencyjny / identyfikator transakcji.}
      tytul: {type: string, description: Tytuł przelewu (pełny).}
      z_rachunku: {type: string, normalize: [iban], pattern: '\d{26}', description: Rachunek zleceniodawcy (26 cyfr).}
