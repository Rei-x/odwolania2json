name: przelew
description: Potwierdzenie wykonania pojedynczego przelewu bankowego wygenerowane przez bank (rachunek nadawcy i odbiorcy, kwota, data operacji, tytuł). Nie jest nim faktura, rachunek do zapłaty, wezwanie do zapłaty, wyciąg z wielu operacji ani prezentacja.
classify:
  keywords:
    'POTWIERDZENIE (WYKONANIA |REALIZACJI )?(POLECENIA )?(PRZELEWU|TRANSAKCJI|OPERACJI)': 6
    'Rachunek (zleceniodawcy|odbiorcy|nadawcy|obciążany|uznawany)': 3
    '\bZ RACHUNKU\b|\bNA RACHUNEK\b': 2
    'Tytuł (przelewu|operacji)|\bOPIS:': 2
    'Kwota|WARTOŚĆ': 1
    'Data (operacji|realizacji|transakcji|księgowania)': 2
    'Numer referencyjny|ID transakcji|Numer transakcji': 1
    '(dowód|potwierdzenie) (wykonania )?przelewu|\bprzelew\w*\b': 2
    'Data wykonania|Nadawca|Adresat przelewu|Odbiorca': 1
    '\bPL ?\d{2}(?: ?\d{4}){6}\b': 2
  filename: ['przelew', 'potwierdzenie']
pages: 2
few_shot: 2
examples: {pdf: [przelew.pdf, potwierdzenie_przelewu.pdf], json: przelew.json}   # pliki w każdym folderze data/train/<sprawa>/
instructions: |
  - Numery rachunków: 26 cyfr, bez prefiksu PL i bez spacji.
  - kwota jako liczba dodatnia (np. 15000.00), także gdy bank pokazuje ją ze znakiem minus (obciążenie).
  - tytul przepisz dokładnie, w całości, z zachowaniem wielkości liter.
  - numer_transakcji: numer referencyjny / identyfikator transakcji, jeśli występuje.
fields:
  przelew_bankowy:
    type: object
    properties:
      data_operacji: {type: date, description: Data operacji / wykonania przelewu.}
      kwota: {type: number, normalize: [amount], description: Kwota przelewu.}
      na_rachunek: {type: string, normalize: [iban], pattern: '\d{26}', description: Rachunek odbiorcy (26 cyfr).}
      numer_transakcji: {type: string, description: Numer referencyjny / identyfikator transakcji.}
      tytul: {type: string, description: Tytuł przelewu (pełny).}
      z_rachunku: {type: string, normalize: [iban], pattern: '\d{26}', description: Rachunek zleceniodawcy (26 cyfr).}

# Tryb deterministyczny (extraction.mode: deterministic): reguły bez LLM, składnia w o2j/deterministic.py.
deterministic:
  pages: 2
  defs:
    iban: '(?:PL)?\s?\d{2}(?:\s?\d{4}){6}'
    month: 'stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia'
    date: '\d{4}-\d{2}-\d{2}|\d{1,2}[./-]\d{1,2}[./-]\d{4}|\d{1,2}\s+(?:{month})\s+\d{4}'
    amount: '-?\d{1,3}(?:[  .]?\d{3})*(?:[,.]\d{2})?(?!\d)'
  classify:
    keywords:   # dokumenty podobne do potwierdzenia przelewu, ale spoza zakresu
      '^\s*FAKTURA\b|Saldo (?:początkowe|końcowe)|WYCIĄG (?:BANKOWY|Z RACHUNKU)|Nabywca|Sprzedawca': -6
  fields:
    przelew_bankowy:
      data_operacji:
        - near: {label: ['(?i)Data (?:operacji|transakcji|wykonania|realizacji|zrealizowania|zlecenia|księgowania|zaksięgowania|obciążenia|waluty)', '(?i)\bw dniu', '(?i)\bWykonano\b', 'zrealizowan[ao]\b', '(?i)\bData\b(?! wydruku| wygenerowania| sporządzenia)'], value: '{date}', window: 80}
      kwota:
        - near: {label: ['(?i)Kwota(?: operacji| przelewu| transakcji| zlecenia)?', '(?i)Przekazana kwota', '(?i)w kwocie', '(?i)WARTOŚĆ', '(?i)Suma'], value: '{amount}', window: 80}
      na_rachunek:
        - near: {label: ['(?i)Rachunek (?:odbiorcy|uzna\w*|beneficjenta|docelowy|wierzyciela)', '(?i)(?:IBAN|Konto|Numer konta) (?:odbiorcy|beneficjenta)', '(?i)Na rachunek(?: nr)?', '(?i)Numer rachunku odbiorcy', '(?i)Konto odbiorcy'], value: '{iban}', window: 80}
        - {regex: '{iban}', nth: 2}
      numer_transakcji:
        - near: {label: ['(?i)Nr ref(?:erencyjny)?\.?', '(?i)Numer referencyjny(?: operacji| transakcji)?', '(?i)Identyfikator (?:operacji|transakcji)', '(?i)ID (?:operacji|transakcji)', '(?i)N(?:ume)?r\.? (?:operacji|transakcji|zlecenia|referencyjny)', '(?i)Referencje', '(?i)Identyfikator'], value: '\b(?=[A-Z0-9/-]*\d)[A-Z0-9][A-Z0-9/-]{5,}\b', window: 80}
      tytul:
        - label: ['(?i)^Tytuł(?:em| przelewu| operacji| płatności)?\s*:?', '(?i)^Opis(?: operacji| przelewu)?\s*:?', '(?i)Tytuł(?:em| przelewu| operacji| płatności)\s*:?']
          lines: 4
          until: '(?i)^(?:Nr ref|Numer|Status|Identyfikator|ID |ZREALIZOWANO|Typ |Opłata|Data|Kanał|Wydrukowano|Bank |Potwierdzenie|Dokument|Kwota|Z poważaniem|Rodzaj|Tryb|Operacja|Przelew został|Powyższ|Dodatkow|Prosimy|W razie|\*)'
          strip: ' ,;:„”"'
          sub: [['[„”"]', ''], ['\.$', '']]
      z_rachunku:
        - near: {label: ['(?i)Rachunek (?:obciąż\w*|zleceniodawcy|nadawcy|płatnika|źródłowy|dłużnika)', '(?i)(?:IBAN|Konto|Numer konta) (?:nadawcy|zleceniodawcy|płatnika)', '(?i)Z rachunku(?: nr)?', '(?i)Numer rachunku nadawcy', '(?i)Konto (?:nadawcy|zleceniodawcy)'], value: '{iban}', window: 80}
        - {regex: '{iban}', nth: 1}
