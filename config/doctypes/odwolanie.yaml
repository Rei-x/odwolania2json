# Klasa dokumentu: odwołanie do Prezesa Krajowej Izby Odwoławczej.
# Dodanie nowej klasy = nowy plik YAML w tym katalogu (bez zmian w kodzie).
name: odwolanie
description: Pismo wykonawcy (Odwołującego) skierowane do Prezesa Krajowej Izby Odwoławczej, wnoszące odwołanie od czynności lub zaniechania zamawiającego w postępowaniu o udzielenie zamówienia publicznego (zarzuty, żądania, wskazanie Zamawiającego i Odwołującego). Nie jest nim wyrok/postanowienie KIO, pismo procesowe innego rodzaju ani materiał informacyjny o odwołaniach.
classify:
  # słowo/regex -> waga; najwyższy wynik wygrywa
  keywords:
    '^\s*ODWOŁANIE\s*$': 5
    'Prezes Krajowej Izby Odwoławczej|Krajowa Izba Odwoławcza': 1
    'Odwołując[yaey]': 3
    'Krajow[aej]+ Izb[ayi] Odwoławcz': 2
    'Zarzut nr': 2
    'wnoszę odwołanie': 3
  filename: ['odwol', 'odwoł']
pages: 4          # kluczowe informacje są na pierwszych stronach
few_shot: 2       # liczba przykładów treningowych dołączanych do promptu
examples: {pdf: odwolanie.pdf, json: odwolanie.json}   # pliki w każdym folderze data/train/<sprawa>/
instructions: |
  - "czynnosc_*" ustalasz WYŁĄCZNIE dla PIERWSZEJ zaskarżonej czynności/zaniechania zamawiającego.
    Zwykle opisuje ją zdanie typu "Zamawiający w dniu <data> <czynność>" albo pierwsza pozycja listy
    "czynności i zaniechań Zamawiającego, polegających na: 1) ...". Nagłówki "Zarzut nr 1 naruszenia ..."
    opisują naruszone przepisy, a nie czynność — nie klasyfikuj na ich podstawie, jeśli czynność jest wskazana wprost.
  - "data" i "miejscowosc" pochodzą z nagłówka pierwszej strony (np. "Koszalin, 16 czerwca 2026 roku").
  - Odwołujący/Zamawiający: dane identyfikacyjne (KRS/NIP/REGON) bierz tylko z bloku danego podmiotu.
  - Konsorcjum odwołujących: podaj Lidera konsorcjum.
  - Przedsiębiorca będący osobą fizyczną: nazwa = sama nazwa firmy (np. "MERIDIAN KONSULTING Patryk Mazur"),
    bez dopisków typu "prowadzący działalność gospodarczą pod firmą"; KRS zwykle brak (null).
  - Pełnomocnik: osoba wskazana jako "reprezentowany przez" / pełnomocnik; imię i nazwisko bez tytułów (adw., r.pr.).
    Gdy wskazano kilku pełnomocników — podaj tylko PIERWSZEGO.
  - pelnomocnik.nazwa: podmiot zatrudniający pełnomocnika — zwykle kancelaria; gdy pełnomocnik jest pracownikiem
    lub członkiem organu odwołującego (albo lidera konsorcjum), wpisz nazwę tego podmiotu.
  - Numery BZP/TED/postępowania przepisz z dokumentu; nie myl numeru TED z BZP.
fields:
  OdwolanieKIO:
    type: object
    properties:
      data:
        type: date
        description: Data z nagłówka pierwszej strony (data sporządzenia odwołania).
      czynnosc_dzien:
        type: date
        description: Data czynności zamawiającego uruchamiającej bieg terminu odwołania — dla pierwszej zaskarżonej czynności. Jeśli brak wiarygodnej daty, null.
      czynnosc_powod_id:
        type: enum
        description: Rodzaj pierwszej zaskarżonej czynności/zaniechania zamawiającego.
        values:
          - {value: 1, label: "Decyzja o odrzuceniu oferty"}
          - {value: 2, label: "Ogłoszenie wyboru oferty"}
          - {value: 3, label: "Decyzja o wykluczeniu wykonawcy"}
          - {value: 4, label: "Publikacja specyfikacji warunków zamówienia (SWZ)"}
          - {value: 5, label: "Modyfikacja treści SWZ"}
          - {value: 6, label: "Odpowiedzi/wyjaśnienia do SWZ"}
          - {value: 7, label: "Zaniechanie odrzucenia oferty"}
          - {value: 8, label: "Zaniechanie wykluczenia wykonawcy"}
          - {value: 9, label: "Decyzja o unieważnieniu postępowania"}
          - {value: 10, label: "Zaniechanie unieważnienia postępowania"}
          - {value: 11, label: "Opis przedmiotu zamówienia (OPZ)"}
          - {value: 12, label: "Projektowane postanowienia umowy"}   # słownik: data/schemas/czynnosc_powod_id_dict.md
      czynnosc_opis:
        type: string
        derive: {label_of: czynnosc_powod_id}   # wypełniane automatycznie etykietą wybranego powodu
        description: Kanoniczny opis czynności zgodny z czynnosc_powod_id.
      miejscowosc:
        type: string
        normalize: [city]
        description: Miejscowość z nagłówka pierwszej strony (z linii 'X, dnia ...' albo 'X DD.MM.RRRR').
  Odwolujacy:
    type: array
    description: Wykonawca wnoszący odwołanie (przy konsorcjum — Lider).
    items:
      type: object
      properties:
        krs: {type: string, normalize: [krs], pattern: '\d{10}', description: KRS Odwołującego (lub Lidera konsorcjum).}
        nazwa: {type: string, description: Pełna nazwa Odwołującego (lub Lidera konsorcjum).}
        nip: {type: string, normalize: [nip], pattern: '\d{10}', description: NIP Odwołującego.}
        regon: {type: string, normalize: [regon], pattern: '\d{9}(\d{5})?', description: REGON Odwołującego.}
        przez-pelnomocnika: {type: integer, description: "1 jeśli Odwołujący działa przez pełnomocnika, 0 jeśli nie."}
        pelnomocnik:
          type: object
          properties:
            imie_nazwisko: {type: string, normalize: [person], single_person: true, description: Imię i nazwisko pełnomocnika Odwołującego (bez tytułów).}
            nazwa: {type: string, description: Nazwa podmiotu (kancelarii) zatrudniającego pełnomocnika.}
            mail: {type: string, description: Adres e-mail kontaktowy pełnomocnika.}
  Zamawiajacy:
    type: array
    description: Zamawiający (może być kilku).
    items:
      type: object
      properties:
        krs: {type: string, normalize: [krs], pattern: '\d{10}', description: KRS Zamawiającego (jeśli jawnie podany przy Zamawiającym).}
        nazwa: {type: string, description: Pełna nazwa Zamawiającego.}
        nip: {type: string, normalize: [nip], pattern: '\d{10}', description: NIP Zamawiającego (jeśli jawnie podany).}
        regon: {type: string, normalize: [regon], pattern: '\d{9}(\d{5})?', description: REGON Zamawiającego (jeśli jawnie podany).}
        prowadzacy_postepowanie: {type: integer, description: "null gdy jest jeden zamawiający; przy kilku: 1 dla oznaczonego jako prowadzący/lider postępowania, 0 dla pozostałych."}
  ZamowieniePubliczne:
    type: object
    properties:
      numer_bzp: {type: string, normalize: [bzp], pattern: '\d{4}/BZP\d{8}(/\d{1,2})?', description: "Numer ogłoszenia w BZP, format 'YYYY/BZP ########' (opcjonalnie '/##'). Nie wpisuj tu numeru TED."}
      numer_postepowania: {type: string, description: "Numer referencyjny / znak / nr postępowania, np. 'ZP.039.2025', 'DZP.260.11.2025'."}
      numer_ted: {type: string, normalize: [ted], pattern: '\d{5,7}-\d{4}', description: "Numer ogłoszenia TED, format 'NNNNNN-YYYY' (z 'YYYY/S ###-NNNNNN' zapisz jako 'NNNNNN-YYYY')."}
      tytul: {type: string, description: Tytuł (nazwa) zamówienia/postępowania, bez cudzysłowów.}
