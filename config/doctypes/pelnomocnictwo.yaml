name: pelnomocnictwo
description: Dokument, w którym mocodawca (wykonawca/podmiot) udziela pełnomocnictwa wskazanym osobom do reprezentowania go, zwykle w postępowaniu o zamówienie publiczne lub przed KIO; zawiera mocodawcę, pełnomocnika(ów) i podpisy. Nie jest nim wzmianka o pełnomocnictwie w innym piśmie.
classify:
  keywords:
    '\bPEŁNOMOCNICTWO\b': 5
    'Mocodawc': 3
    'udziela(m|my|ją)? pełnomocnictwa': 3
    'ustanawia(m|my|ją)? (swoim |swoimi )?pełnomocnik': 3
    'Pełnomocnictwo przyjmuję|do reprezentowania': 1
    'pełnomocnikami|pełnomocnikiem': 2
    'umocowan': 1
  filename: ['pelnomoc', 'pełnomoc']
pages: 3
few_shot: 2
page_images: [last]   # obraz ostatniej strony (podpisy graficzne/elektroniczne)
examples: {pdf: pelnomocnictwo.pdf, json: pelnomocnictwo.json}   # pliki w każdym folderze data/train/<sprawa>/
instructions: |
  - Mocodawców może być kilku (np. konsorcjum udzielające pełnomocnictwa wspólnie) — każdy osobno.
  - Dla osoby prawnej imie_nazwisko = null; dla przedsiębiorcy będącego osobą fizyczną (np. "DUDEK-TECH Jarosław Dudek")
    typ = "osoba_fizyczna", imie_nazwisko = imię i nazwisko, nazwa = pełna nazwa firmy
    (bez dopisków typu "prowadzący działalność gospodarczą pod firmą").
  - podpisujacy: osoby podpisane w imieniu danego mocodawcy (pod "Mocodawca:" / "W imieniu ..."), bez stanowisk.
    Liczą się też pieczęcie podpisu elektronicznego: "Dokument podpisany przez X; Firma", "Signed by / Podpisano przez: X",
    "Podpisany elektronicznie przez X" — podaj samo imię i nazwisko X (bez nazwy firmy).
    Ta sama osoba w bloku podpisu i w pieczęci elektronicznej to JEDEN podpisujący — podaj zapis z bloku podpisu.
    Pełnomocnik podpisujący "Pełnomocnictwo przyjmuję" NIE jest podpisującym w imieniu mocodawcy.
  - pelnomocnicy: imię i nazwisko w mianowniku, bez tytułów (adw., r.pr.); PESEL tylko jeśli podany.
    Gdy pełnomocnikiem jest podmiot (np. spółka – lider konsorcjum), wpisz jego nazwę w imie_nazwisko.
  - Nie wymyślaj danych — brak = null.
fields:
  mocodawca:
    type: array
    items:
      type: object
      properties:
        data:
          type: object
          properties:
            imie_nazwisko: {type: string, normalize: [person], single_person: true, description: "Imię i nazwisko mocodawcy będącego osobą fizyczną; dla osoby prawnej null."}
            krs: {type: string, normalize: [krs], pattern: '\d{10}', description: Numer KRS mocodawcy.}
            nazwa: {type: string, description: Pełna nazwa mocodawcy.}
            nip: {type: string, normalize: [nip], pattern: '\d{10}', description: Numer NIP mocodawcy.}
            typ: {type: enum, values: [osoba_prawna, osoba_fizyczna], description: Typ mocodawcy.}
        podpisujacy:
          type: array
          dedupe: person
          items:
            type: object
            properties:
              imie_nazwisko: {type: string, normalize: [person], single_person: true, description: Imię i nazwisko osoby podpisującej w imieniu mocodawcy.}
  pelnomocnicy:
    type: array
    dedupe: person
    items:
      type: object
      properties:
        imie_nazwisko: {type: string, normalize: [person], single_person: true, description: Imię i nazwisko pełnomocnika w mianowniku.}
        pesel: {type: integer, normalize: [pesel], description: PESEL pełnomocnika (jeśli podany).}
