# Ustawienia runtime. Sekrety (klucze API) w pliku .env lub zmiennych środowiskowych.
llm:
  base_url: ${O2J_LLM_BASE_URL}      # dowolne API zgodne z OpenAI (np. dostawca w UE)
  api_key: ${O2J_LLM_API_KEY}
  model: ${O2J_LLM_MODEL}
  temperature: 0
  max_tokens: 32000                  # modele reasoningowe zużywają część limitu na myślenie
  structured_output: json_schema     # json_schema | json_object
  timeout: 180
  retries: 5
  extra_body: null                   # np. {provider: {order: [...]}} dla OpenRouter
ocr:
  min_chars_per_page: 40             # mniej znaków => strona traktowana jako skan
  garbage_threshold: 0.1             # jakość tekstu poniżej => zepsute kodowanie fontu => OCR strony
  engine: vlm                        # vlm (model wizyjny po API) | paddle (PaddleOCR-VL-1.6 lokalnie, CPU) | none
  model: ${O2J_OCR_MODEL}            # puste => model z sekcji llm
  reasoning: off                     # OCR nie potrzebuje myślenia (off | low | medium | high)
  max_tokens: 16000
  preprocess: [doc_ori]              # przed OCR: doc_ori (PP-LCNet, 0/90/180/270), deskew, flat, denoise, up, orient (heurystyka)
  attach_images: true                # dla skanów: tekst OCR + obrazy stron do modelu ekstrakcji
  dpi: 200
  max_pages: 4                       # OCR tylko pierwszych N stron (kluczowe dane są na początku)
voting:
  n: 1                               # >1 => kilka niezależnych ekstrakcji i głosowanie per pole
  models: []                         # np. [deepseek/deepseek-v4.1-flash, qwen/...]; puste => model z sekcji llm
  temperature: 0.7                   # dla przebiegów ponad liczbę modeli
extraction:
  mode: llm                          # llm (LLM + weryfikacja/naprawa) | deterministic (reguły z sekcji `deterministic:` w YAML typów, zero wywołań LLM)
  ocr_engine: none                   # tylko dla deterministic: none | paddle (lokalny OCR); vlm wymagałby LLM
router:                              # tryb automatyczny: eskalacja tylko trudnych dokumentów
  enabled: false                     # włączany profilem `auto`
  escalate_if: {disputed_fields: 1, remaining_issues: 1, ocr: true, novelty: 40}
  escalation:                        # kaskada: kolejne poziomy uruchamiane tylko gdy poprzedni nie potwierdza wyniku
    levels:
      - [deepseek/deepseek-v4.1-flash]
      - [moonshotai/kimi-k3.1-pro]
    include_deterministic: true      # reguły YAML jako dodatkowy głos przy remisie
verify:
  max_rounds: 2                      # pętla weryfikacja -> naprawa (0 = wyłączona)
classification:
  mode: llm_confirm                  # rules | llm_confirm (LLM potwierdza typ, odrzuca dokumenty spoza puli)
  min_score: 3                       # poniżej => klasyfikacja przez LLM
paths:
  doctypes: config/doctypes
  train: data/train                  # źródło przykładów few-shot
  trace: trace                       # ślady ekstrakcji (dowody, strony, cytaty)
  learned: data/learned              # pamięć: dokumenty zweryfikowane przez użytkowników (uczenie w czasie)

# Przypięcie modeli do dostawców w UE (OpenRouter provider routing), także dla OCR, głosowania i kaskady.
providers:
  z-ai/glm-5.3-flash: {only: [mistral], allow_fallbacks: false, data_collection: deny}          # Mistral AI (FR)
  google/gemma-4-26b-a4b-it: {only: [nextbit], allow_fallbacks: false, data_collection: deny}   # NextBit (ES)
  mistralai/ministral-14b-2512: {only: [mistral/eu], allow_fallbacks: false, data_collection: deny}
  deepseek/deepseek-v4.1-flash: {only: [nebius], allow_fallbacks: false, data_collection: deny}  # Nebius (NL)
  moonshotai/kimi-k3.1-pro: {only: [nebius], allow_fallbacks: false, data_collection: deny}      # Nebius (NL)

# Suwak dokładność / koszt: profile nadpisujące ustawienia (CLI: --profile, GUI: suwak).
profile: standard
profiles:
  deterministyczny:                  # bez LLM: reguły z YAML (najtańszy, w pełni powtarzalny)
    extraction: {mode: deterministic}
    classification: {mode: rules}
    verify: {max_rounds: 0}
  ekonomiczny:                       # najlżejszy dobry model: 3.8B aktywnych parametrów (Apache-2.0)
    llm: {model: google/gemma-4-26b-a4b-it}
    ocr: {model: z-ai/glm-5.3-flash, reasoning: low}
    verify: {max_rounds: 0}
  standard:                          # GLM-5.3-Flash (MIT) + weryfikacja i naprawa
    llm: {model: z-ai/glm-5.3-flash}
    ocr: {model: z-ai/glm-5.3-flash, reasoning: low}
  auto:                              # router: mały model + reguły; trudne dokumenty eskalują: GLM-5.3 -> Kimi K3.1 Pro
    llm: {model: google/gemma-4-26b-a4b-it}
    ocr: {model: z-ai/glm-5.3-flash, reasoning: low}
    router:
      enabled: true
      escalation: {levels: [[z-ai/glm-5.3-flash], [moonshotai/kimi-k3.1-pro]], include_deterministic: true}
  maksymalny:                        # najmocniejsze modele + głosowanie per pole
    llm: {model: moonshotai/kimi-k3.1-pro}
    ocr: {model: z-ai/glm-5.3-flash, reasoning: low}
    voting: {n: 3, models: [moonshotai/kimi-k3.1-pro, z-ai/glm-5.3-flash, deepseek/deepseek-v4.1-flash]}